{% extends 'FruitFrenzy/base.html' %}
{% load static %}

{% block content %}
<style>
              .review-form {
                margin: 0 auto;
                max-width: 500px;
                padding: 20px;
                background-color: #f8f8f8;
                border: 1px solid #ccc;
                border-radius: 5px;
            }

            .review-form h2 {
                text-align: center;
                margin-bottom: 20px;
            }

            .review-form .form-group {
                margin-bottom: 20px;
            }

            .review-form label {
                font-weight: bold;
            }

            .review-form input[type="text"],
            .review-form textarea,
            .review-form select {
                width: 100%;
                padding: 10px;
                font-size: 16px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }

            .review-form button[type="submit"] {
                display: block;
                width: 100%;
                padding: 10px;
                background-color: #007bff;
                color: #fff;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            .review-form button[type="submit"]:hover {
                background-color: #0056b3;
            }
        </style>

    <div class="container" >
        <div class="review-form">
            <h2>Create Review</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_review_title">Review Title</label>
                    {{ form.review_title }}
                </div>
                <div class="form-group">
                    <label for="id_review_content">Review</label>
                    {{ form.review_content }}
                </div>
                <div class="form-group">
                    <label for="id_review_rating">Rating</label>
                    {{ form.review_rating }}
                </div>
                <div class="form-group">
                    <label for="id_product_image">Product Image</label>
                    {{ form.product_image }}
                </div>
                <button type="submit">Submit Review</button>
            </form>
        </div>
    </div>

{% endblock %}
